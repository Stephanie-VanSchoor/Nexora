<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexora — Marketplace</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #6366f1;
        }

        nav {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 10px;
            padding: 11px 16px;
            font-weight: bold;
        }

        .btn-primary {
            background: #6366f1;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .hero {
            padding: 70px 5%;
            text-align: center;
            background: linear-gradient(135deg, #111827, #312e81);
            color: white;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #d1d5db;
            font-size: 18px;
        }

        .controls {
            padding: 25px 5%;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
        }

        .search {
            max-width: 500px;
        }

        .category {
            max-width: 220px;
        }

        .products {
            padding: 20px 5% 60px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            transition: .2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #e5e7eb;
        }

        .card-content {
            padding: 18px;
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .description {
            color: #6b7280;
            min-height: 45px;
            margin-bottom: 15px;
        }

        .price {
            font-size: 23px;
            font-weight: bold;
            color: #6366f1;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions button {
            flex: 1;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.65);
            z-index: 200;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: white;
            border-radius: 18px;
            padding: 25px;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-box h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .admin-panel {
            display: none;
            padding: 30px 5%;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
            grid-column: 1/-1;
        }

        .loading {
            text-align: center;
            padding: 60px;
            grid-column: 1/-1;
        }

        .cart {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #6366f1;
            color: white;
            border-radius: 50px;
            padding: 15px 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,.2);
            z-index: 150;
        }

        .detail-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 12px;
            background: #f3f4f6;
            margin-bottom: 20px;
        }

        .gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
        }

        .gallery img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }

        footer {
            background: #111827;
            color: white;
            padding: 40px 5%;
            text-align: center;
        }

        @media(max-width: 600px) {
            .hero h1 {
                font-size: 34px;
            }

            header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Nex<span>ora</span></div>

    <nav>
        <button class="btn-secondary" onclick="openCart()">
            🛒 Panier (<span id="cartCount">0</span>)
        </button>

        <button class="btn-primary" onclick="openAdminLogin()">
            🔐 Admin
        </button>
    </nav>
</header>

<section class="hero">
    <h1>Bienvenue sur Nexora</h1>
    <p>Découvrez nos produits numériques</p>
</section>

<section class="controls">
    <input
        class="search"
        id="search"
        type="text"
        placeholder="🔎 Rechercher un produit..."
        oninput="renderProducts()"
    >

    <select
        class="category"
        id="category"
        onchange="renderProducts()"
    >
        <option value="">Toutes les catégories</option>
    </select>
</section>

<section id="adminPanel" class="admin-panel">

    <h2>⚙️ Administration</h2>

    <br>

    <div class="admin-actions">
        <button class="btn-primary" onclick="openProductForm()">
            ➕ Ajouter un produit
        </button>

        <button class="btn-danger" onclick="logoutAdmin()">
            Déconnexion
        </button>
    </div>

</section>

<main class="products" id="products">
    <div class="loading">
        Chargement des produits...
    </div>
</main>

<button class="cart" onclick="openCart()">
    🛒 Panier
    <span id="cartTotal">0.00 €</span>
</button>

<footer>
    <p>© 2026 Nexora — Marketplace numérique</p>
</footer>


<!-- LOGIN ADMIN -->

<div class="modal" id="loginModal">
    <div class="modal-box">

        <h2>🔐 Connexion administrateur</h2>

        <div class="form-group">
            <label>Email</label>
            <input id="adminEmail" type="email" placeholder="admin@email.com">
        </div>

        <div class="form-group">
            <label>Mot de passe</label>
            <input id="adminPassword" type="password">
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="loginAdmin()">
                Se connecter
            </button>

            <button class="btn-secondary" onclick="closeModal('loginModal')">
                Annuler
            </button>
        </div>

    </div>
</div>


<!-- FORMULAIRE PRODUIT -->

<div class="modal" id="productModal">

    <div class="modal-box">

        <h2 id="productModalTitle">
            Ajouter un produit
        </h2>

        <input type="hidden" id="productId">

        <div class="form-group">
            <label>Nom du produit</label>
            <input id="productName" type="text">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea id="productDescription" rows="5"></textarea>
        </div>

        <div class="form-group">
            <label>Prix (€)</label>
            <input id="productPrice" type="number" min="0" step="0.01">
        </div>

        <div class="form-group">
            <label>Catégorie</label>
            <input id="productCategory" type="text" placeholder="Templates">
        </div>

        <div class="form-group">
            <label>Images</label>
            <input
                id="productImages"
                type="file"
                accept="image/*"
                multiple
            >
        </div>

        <div class="form-group">
            <label>Fichiers numériques</label>
            <input
                id="productFiles"
                type="file"
                multiple
            >
        </div>

        <div class="actions">

            <button class="btn-primary" onclick="saveProduct()">
                💾 Enregistrer
            </button>

            <button
                class="btn-secondary"
                onclick="closeModal('productModal')"
            >
                Annuler
            </button>

        </div>

    </div>
</div>


<!-- DETAIL PRODUIT -->

<div class="modal" id="detailModal">

    <div class="modal-box">

        <div id="detailContent"></div>

        <br>

        <button
            class="btn-secondary"
            onclick="closeModal('detailModal')"
        >
            Fermer
        </button>

    </div>

</div>


<!-- PANIER -->

<div class="modal" id="cartModal">

    <div class="modal-box">

        <h2>🛒 Mon panier</h2>

        <div id="cartContent"></div>

        <br>

        <button class="btn-primary" onclick="checkout()">
            💳 Commander
        </button>

        <button
            class="btn-secondary"
            onclick="closeModal('cartModal')"
        >
            Fermer
        </button>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   VARIABLES
========================================================= */

let products = [];
let cart = [];
let currentUser = null;


/* =========================================================
   INITIALISATION
========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

    await checkAdmin();

    await loadProducts();

});


/* =========================================================
   AUTH ADMIN
========================================================= */

async function checkAdmin() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    currentUser = session?.user || null;

    updateAdminPanel();
}


async function loginAdmin() {

    const email =
        document.getElementById("adminEmail").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    if (!email || !password) {
        alert("Veuillez remplir les champs.");
        return;
    }

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (error) {

        console.error(error);

        alert(
            "Connexion impossible : " +
            error.message
        );

        return;
    }

    currentUser = data.user;

    closeModal("loginModal");

    updateAdminPanel();

    alert("Connexion réussie !");
}


async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    currentUser = null;

    updateAdminPanel();

    alert("Vous êtes déconnecté.");
}


function updateAdminPanel() {

    const panel =
        document.getElementById("adminPanel");

    if (currentUser) {
        panel.classList.add("active");
    } else {
        panel.classList.remove("active");
    }
}


/* =========================================================
   PRODUITS
========================================================= */

async function loadProducts() {

    const {
        data,
        error
    } = await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(error);

        document.getElementById("products").innerHTML = `
            <div class="empty">
                ❌ Impossible de charger les produits.
                <br><br>
                Vérifie ta connexion Supabase.
            </div>
        `;

        return;
    }

    products = data || [];

    updateCategories();

    renderProducts();
}


function updateCategories() {

    const select =
        document.getElementById("category");

    const categories =
        [...new Set(
            products
                .map(p => p.category)
                .filter(Boolean)
        )];

    select.innerHTML =
        `<option value="">Toutes les catégories</option>`;

    categories.forEach(category => {

        const option =
            document.createElement("option");

        option.value = category;
        option.textContent = category;

        select.appendChild(option);

    });
}


function renderProducts() {

    const container =
        document.getElementById("products");

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase();

    const category =
        document
            .getElementById("category")
            .value;

    const filtered =
        products.filter(product => {

            const matchesSearch =
                product.name
                    .toLowerCase()
                    .includes(search) ||

                product.description
                    .toLowerCase()
                    .includes(search);

            const matchesCategory =
                !category ||
                product.category === category;

            return matchesSearch &&
                   matchesCategory;
        });


    if (!filtered.length) {

        container.innerHTML = `
            <div class="empty">
                Aucun produit trouvé.
            </div>
        `;

        return;
    }


    container.innerHTML =
        filtered.map(product => {

            const image =
                product.images &&
                product.images.length
                    ? product.images[0]
                    : "https://via.placeholder.com/600x400?text=Nexora";


            return `
                <article class="card">

                    <img
                        class="card-image"
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(product.name)}"
                    >

                    <div class="card-content">

                        <h3>
                            ${escapeHTML(product.name)}
                        </h3>

                        <p class="description">
                            ${escapeHTML(
                                product.description || ""
                            ).substring(0, 100)}
                        </p>

                        <div class="price">
                            ${Number(product.price).toFixed(2)} €
                        </div>

                        <div class="actions">

                            <button
                                class="btn-primary"
                                onclick="showProduct('${product.id}')"
                            >
                                Voir
                            </button>

                            <button
                                class="btn-secondary"
                                onclick="addToCart('${product.id}')"
                            >
                                🛒
                            </button>

                        </div>

                        ${
                            currentUser
                            ? `
                                <br>

                                <div class="actions">

                                    <button
                                        class="btn-secondary"
                                        onclick="editProduct('${product.id}')"
                                    >
                                        ✏️ Modifier
                                    </button>

                                    <button
                                        class="btn-danger"
                                        onclick="deleteProduct('${product.id}')"
                                    >
                                        🗑️
                                    </button>

                                </div>
                            `
                            : ""
                        }

                    </div>

                </article>
            `;

        }).join("");
}


/* =========================================================
   UPLOAD SUPABASE STORAGE
========================================================= */

async function uploadFile(
    bucket,
    file,
    folder
) {

    const extension =
        file.name.includes(".")
            ? file.name.split(".").pop()
            : "";

    const fileName =
        `${crypto.randomUUID()}${extension ? "." + extension : ""}`;

    const path =
        `${folder}/${fileName}`;


    const {
        error
    } = await supabaseClient
        .storage
        .from(bucket)
        .upload(path, file, {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
        });


    if (error) {
        throw error;
    }


    const {
        data
    } = supabaseClient
        .storage
        .from(bucket)
        .getPublicUrl(path);


    return data.publicUrl;
}


/* =========================================================
   AJOUT / MODIFICATION
========================================================= */

function openProductForm() {

    if (!currentUser) {
        alert("Connecte-toi en administrateur.");
        return;
    }

    document.getElementById("productModalTitle")
        .textContent = "Ajouter un produit";

    document.getElementById("productId").value = "";

    document.getElementById("productName").value = "";

    document.getElementById("productDescription").value = "";

    document.getElementById("productPrice").value = "";

    document.getElementById("productCategory").value = "";

    document.getElementById("productImages").value = "";

    document.getElementById("productFiles").value = "";

    openModal("productModal");
}


function editProduct(id) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;


    document.getElementById("productModalTitle")
        .textContent = "Modifier le produit";

    document.getElementById("productId").value =
        product.id;

    document.getElementById("productName").value =
        product.name;

    document.getElementById("productDescription").value =
        product.description || "";

    document.getElementById("productPrice").value =
        product.price;

    document.getElementById("productCategory").value =
        product.category;

    document.getElementById("productImages").value = "";

    document.getElementById("productFiles").value = "";

    openModal("productModal");
}


async function saveProduct() {

    if (!currentUser) {
        alert("Tu dois être connecté.");
        return;
    }


    const id =
        document.getElementById("productId").value;

    const name =
        document.getElementById("productName")
            .value.trim();

    const description =
        document.getElementById("productDescription")
            .value.trim();

    const price =
        Number(
            document.getElementById("productPrice")
                .value
        );

    const category =
        document.getElementById("productCategory")
            .value.trim();


    if (!name || !category || isNaN(price)) {

        alert(
            "Nom, catégorie et prix sont obligatoires."
        );

        return;
    }


    const imageFiles =
        document.getElementById("productImages")
            .files;

    const digitalFiles =
        document.getElementById("productFiles")
            .files;


    try {

        let images = [];

        let files = [];


        /*
         * Si modification :
         * conserver les anciennes images/fichiers
         */

        if (id) {

            const old =
                products.find(p => p.id === id);

            images =
                old?.images || [];

            files =
                old?.files || [];
        }


        /* Upload images */

        for (const file of imageFiles) {

            const url =
                await uploadFile(
                    "product-images",
                    file,
                    id || crypto.randomUUID()
                );

            images.push(url);
        }


        /* Upload fichiers */

        for (const file of digitalFiles) {

            const url =
                await uploadFile(
                    "product-files",
                    file,
                    id || crypto.randomUUID()
                );

            files.push({
                name: file.name,
                url: url,
                size: file.size,
                type: file.type
            });
        }


        const productData = {

            name,

            description,

            price,

            category,

            images,

            files,

            updated_at:
                new Date().toISOString()

        };


        if (id) {

            const {
                error
            } = await supabaseClient
                .from("products")
                .update(productData)
                .eq("id", id);


            if (error) throw error;

            alert("Produit modifié !");

        } else {

            const {
                error
            } = await supabaseClient
                .from("products")
                .insert(productData);


            if (error) throw error;

            alert("Produit ajouté !");

        }


        closeModal("productModal");

        await loadProducts();


    } catch (error) {

        console.error(error);

        alert(
            "Erreur pendant l'enregistrement :\n" +
            error.message
        );
    }
}


/* =========================================================
   SUPPRESSION
========================================================= */

async function deleteProduct(id) {

    if (!currentUser) return;


    const product =
        products.find(p => p.id === id);

    if (!product) return;


    if (
        !confirm(
            `Supprimer "${product.name}" ?`
        )
    ) {
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


    if (error) {

        alert(
            "Erreur : " +
            error.message
        );

        return;
    }


    products =
        products.filter(p => p.id !== id);

    renderProducts();

    updateCategories();

    alert("Produit supprimé.");
}


/* =========================================================
   DETAIL PRODUIT
========================================================= */

function showProduct(id) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;


    const images =
        product.images || [];


    let mainImage =
        images[0] ||
        "https://via.placeholder.com/600x400?text=Nexora";


    document.getElementById("detailContent")
        .innerHTML = `

        <h2>
            ${escapeHTML(product.name)}
        </h2>

        <br>

        <img
            id="detailMainImage"
            class="detail-image"
            src="${escapeHTML(mainImage)}"
        >

        ${
            images.length
            ? `
                <div class="gallery">

                    ${
                        images.map(image => `
                            <img
                                src="${escapeHTML(image)}"
                                onclick="
                                    document.getElementById(
                                        'detailMainImage'
                                    ).src='${escapeHTML(image)}'
                                "
                            >
                        `).join("")
                    }

                </div>
            `
            : ""
        }

        <p>
            ${escapeHTML(product.description || "")}
        </p>

        <br>

        <div class="price">
            ${Number(product.price).toFixed(2)} €
        </div>

        <button
            class="btn-primary"
            onclick="addToCart('${product.id}')"
        >
            🛒 Ajouter au panier
        </button>

    `;


    openModal("detailModal");
}


/* =========================================================
   PANIER
========================================================= */

function addToCart(id) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;


    const existing =
        cart.find(item => item.id === id);


    if (existing) {

        existing.quantity++;

    } else {

        cart.push({
            id: product.id,
            name: product.name,
            price: Number(product.price),
            quantity: 1
        });

    }


    updateCart();

    alert(
        `"${product.name}" ajouté au panier.`
    );
}


function updateCart() {

    const count =
        cart.reduce(
            (total, item) =>
                total + item.quantity,
            0
        );


    const total =
        cart.reduce(
            (total, item) =>
                total +
                item.price *
                item.quantity,
            0
        );


    document.getElementById("cartCount")
        .textContent = count;

    document.getElementById("cartTotal")
        .textContent =
        total.toFixed(2) + " €";
}


function openCart() {

    const container =
        document.getElementById("cartContent");


    if (!cart.length) {

        container.innerHTML = `
            <p>
                Ton panier est vide.
            </p>
        `;

        openModal("cartModal");

        return;
    }


    container.innerHTML = `

        ${cart.map(item => `

            <div style="
                padding:15px 0;
                border-bottom:1px solid #ddd;
            ">

                <strong>
                    ${escapeHTML(item.name)}
                </strong>

                <br>

                ${item.quantity} ×
                ${item.price.toFixed(2)} €

                <br><br>

                <button
                    class="btn-danger"
                    onclick="removeFromCart('${item.id}')"
                >
                    Supprimer
                </button>

            </div>

        `).join("")}

        <br>

        <strong style="font-size:20px">
            Total :
            ${cart.reduce(
                (total, item) =>
                    total +
                    item.price *
                    item.quantity,
                0
            ).toFixed(2)} €
        </strong>
    `;


    openModal("cartModal");
}


function removeFromCart(id) {

    cart =
        cart.filter(item => item.id !== id);

    updateCart();

    openCart();
}


/* =========================================================
   PAIEMENT
========================================================= */

function checkout() {

    if (!cart.length) {

        alert("Ton panier est vide.");

        return;
    }


    /*
     * Ici on pourra connecter Stripe,
     * PayPal ou une autre solution
     * de paiement.
     */

    alert(
        "Le paiement sera connecté dans la prochaine étape."
    );
}


/* =========================================================
   MODALS
========================================================= */

function openModal(id) {

    document
        .getElementById(id)
        .classList.add("active");
}


function closeModal(id) {

    document
        .getElementById(id)
        .classList.remove("active");
}


function openAdminLogin() {

    if (currentUser) {

        document
            .getElementById("adminPanel")
            .scrollIntoView({
                behavior: "smooth"
            });

        return;
    }

    openModal("loginModal");
}


/* =========================================================
   SECURITE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


</script>
