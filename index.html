<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora — Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 16px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 27px;
    font-weight: 800;
}

.logo span {
    color: #6366f1;
}

nav {
    display: flex;
    gap: 10px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
}

.primary {
    background: #6366f1;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.danger {
    background: #ef4444;
    color: white;
}

.hero {
    background: linear-gradient(135deg, #111827, #312e81);
    color: white;
    text-align: center;
    padding: 80px 20px;
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 15px;
}

.hero p {
    color: #d1d5db;
    font-size: 18px;
}

.controls {
    padding: 25px 5%;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.controls input,
.controls select {
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
}

.search {
    width: 450px;
    max-width: 100%;
}

.category {
    width: 220px;
}

.admin {
    display: none;
    background: white;
    padding: 25px 5%;
    border-bottom: 1px solid #ddd;
}

.admin.active {
    display: block;
}

.admin-buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.products {
    padding: 20px 5% 70px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 25px;
}

.card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.card-image {
    width: 100%;
    height: 210px;
    object-fit: cover;
    background: #e5e7eb;
}

.card-content {
    padding: 18px;
}

.card h3 {
    margin-bottom: 8px;
}

.card-description {
    color: #6b7280;
    min-height: 45px;
    margin-bottom: 15px;
}

.price {
    color: #6366f1;
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 15px;
}

.actions {
    display: flex;
    gap: 8px;
}

.actions button {
    flex: 1;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 70px 20px;
    color: #6b7280;
}

.loading {
    grid-column: 1 / -1;
    text-align: center;
    padding: 70px;
}

.cart-button {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 900;
    background: #6366f1;
    color: white;
    padding: 15px 22px;
    border-radius: 50px;
    box-shadow: 0 8px 25px rgba(0,0,0,.25);
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 2000;
    padding: 20px;
    overflow-y: auto;
}

.modal.active {
    display: flex;
    justify-content: center;
    align-items: center;
}

.modal-box {
    background: white;
    border-radius: 18px;
    width: 100%;
    max-width: 650px;
    padding: 25px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-box h2 {
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
}

.form-group textarea {
    resize: vertical;
}

.detail-image {
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    border-radius: 12px;
    background: #f3f4f6;
}

.gallery {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin: 15px 0;
}

.gallery img {
    width: 75px;
    height: 75px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
}

.cart-item {
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
}

footer {
    background: #111827;
    color: white;
    text-align: center;
    padding: 40px 20px;
}

@media(max-width:600px) {

    header {
        flex-direction: column;
        gap: 15px;
    }

    .hero h1 {
        font-size: 35px;
    }

    .products {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Nex<span>ora</span>
    </div>

    <nav>

        <button class="secondary" onclick="openCart()">
            🛒 Panier (<span id="cartCount">0</span>)
        </button>

        <button class="primary" onclick="openLogin()">
            🔐 Admin
        </button>

    </nav>

</header>


<section class="hero">

    <h1>Bienvenue sur Nexora</h1>

    <p>
        Découvrez nos meilleurs produits numériques
    </p>

</section>


<section class="controls">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Rechercher..."
        oninput="renderProducts()"
    >

    <select
        id="category"
        class="category"
        onchange="renderProducts()"
    >
        <option value="">
            Toutes les catégories
        </option>
    </select>

</section>


<section id="adminPanel" class="admin">

    <h2>⚙️ Administration Nexora</h2>

    <div class="admin-buttons">

        <button class="primary" onclick="openProductForm()">
            ➕ Ajouter un produit
        </button>

        <button class="danger" onclick="logout()">
            Déconnexion
        </button>

    </div>

</section>


<main id="products" class="products">

    <div class="loading">
        Chargement des produits...
    </div>

</main>


<button class="cart-button" onclick="openCart()">
    🛒 <span id="cartTotal">0.00 €</span>
</button>


<footer>

    <p>
        © 2026 Nexora — Marketplace numérique
    </p>

</footer>


<!-- =========================
     LOGIN
========================= -->

<div id="loginModal" class="modal">

    <div class="modal-box">

        <h2>🔐 Administration</h2>

        <div class="form-group">

            <label>Email</label>

            <input
                id="adminEmail"
                type="email"
                placeholder="ton@email.com"
            >

        </div>

        <div class="form-group">

            <label>Mot de passe</label>

            <input
                id="adminPassword"
                type="password"
            >

        </div>

        <div class="actions">

            <button
                class="primary"
                onclick="login()"
            >
                Se connecter
            </button>

            <button
                class="secondary"
                onclick="closeModal('loginModal')"
            >
                Annuler
            </button>

        </div>

    </div>

</div>


<!-- =========================
     PRODUIT
========================= -->

<div id="productModal" class="modal">

    <div class="modal-box">

        <h2 id="productTitle">
            Ajouter un produit
        </h2>

        <input
            id="productId"
            type="hidden"
        >

        <div class="form-group">

            <label>Nom du produit</label>

            <input
                id="productName"
                type="text"
                placeholder="Nom du produit"
            >

        </div>

        <div class="form-group">

            <label>Description</label>

            <textarea
                id="productDescription"
                rows="5"
                placeholder="Description..."
            ></textarea>

        </div>

        <div class="form-group">

            <label>Prix (€)</label>

            <input
                id="productPrice"
                type="number"
                min="0"
                step="0.01"
                placeholder="9.99"
            >

        </div>

        <div class="form-group">

            <label>Catégorie</label>

            <input
                id="productCategory"
                type="text"
                placeholder="Templates"
            >

        </div>

        <div class="form-group">

            <label>Images</label>

            <input
                id="productImages"
                type="file"
                accept="image/*"
                multiple
            >

            <small>
                Tu peux sélectionner plusieurs images.
            </small>

        </div>

        <div class="form-group">

            <label>Fichiers numériques</label>

            <input
                id="productFiles"
                type="file"
                multiple
            >

        </div>

        <div class="actions">

            <button
                class="primary"
                onclick="saveProduct()"
            >
                💾 Enregistrer
            </button>

            <button
                class="secondary"
                onclick="closeModal('productModal')"
            >
                Annuler
            </button>

        </div>

    </div>

</div>


<!-- =========================
     DETAIL
========================= -->

<div id="detailModal" class="modal">

    <div class="modal-box">

        <div id="detailContent"></div>

        <br>

        <button
            class="secondary"
            onclick="closeModal('detailModal')"
        >
            Fermer
        </button>

    </div>

</div>


<!-- =========================
     PANIER
========================= -->

<div id="cartModal" class="modal">

    <div class="modal-box">

        <h2>🛒 Mon panier</h2>

        <div id="cartContent"></div>

        <br>

        <button
            class="primary"
            onclick="checkout()"
        >
            💳 Commander
        </button>

        <button
            class="secondary"
            onclick="closeModal('cartModal')"
        >
            Fermer
        </button>

    </div>

</div>


<script>

/* =====================================================
   1. CONFIGURATION SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://lqaqfzpsilxctrvazatp.supabase.co";

const SUPABASE_ANON_KEY =sb_publishable_f1eSE1egBbwf1keuk0Qlyg_fmKgquq7


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   2. VARIABLES
===================================================== */

let products = [];

let cart = [];

let currentUser = null;


/* =====================================================
   3. DEMARRAGE
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        await checkUser();

        await loadProducts();

        updateCart();

    }
);


/* =====================================================
   4. AUTHENTIFICATION
===================================================== */

async function checkUser() {

    const {
        data
    } = await supabaseClient
        .auth
        .getSession();

    currentUser =
        data.session
            ? data.session.user
            : null;

    updateAdmin();

}


async function login() {

    const email =
        document
            .getElementById("adminEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("adminPassword")
            .value;


    if (!email || !password) {

        alert(
            "Entre ton email et ton mot de passe."
        );

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .signInWithPassword({
                email: email,
                password: password
            });


    if (error) {

        alert(
            "Erreur de connexion : " +
            error.message
        );

        return;
    }


    currentUser = data.user;

    closeModal("loginModal");

    updateAdmin();

    renderProducts();

    alert("Connexion réussie !");
}


async function logout() {

    await supabaseClient
        .auth
        .signOut();

    currentUser = null;

    updateAdmin();

    renderProducts();

}


function updateAdmin() {

    const panel =
        document.getElementById(
            "adminPanel"
        );

    if (currentUser) {

        panel.classList.add("active");

    } else {

        panel.classList.remove("active");

    }
}


/* =====================================================
   5. CHARGER LES PRODUITS
===================================================== */

async function loadProducts() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        document.getElementById(
            "products"
        ).innerHTML = `
            <div class="empty">
                ❌ Erreur de connexion à Supabase.
                <br><br>
                Vérifie ta configuration.
            </div>
        `;

        return;
    }


    products = data || [];

    updateCategories();

    renderProducts();

}


/* =====================================================
   6. CATEGORIES
===================================================== */

function updateCategories() {

    const select =
        document.getElementById(
            "category"
        );


    const categories =
        [
            ...new Set(
                products
                    .map(
                        product =>
                            product.category
                    )
                    .filter(Boolean)
            )
        ];


    select.innerHTML =
        `<option value="">
            Toutes les catégories
        </option>`;


    categories.forEach(
        category => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                category;

            option.textContent =
                category;

            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   7. AFFICHER PRODUITS
===================================================== */

function renderProducts() {

    const container =
        document.getElementById(
            "products"
        );


    const search =
        document.getElementById(
            "search"
        ).value.toLowerCase();


    const category =
        document.getElementById(
            "category"
        ).value;


    const filtered =
        products.filter(
            product => {

                const name =
                    (
                        product.name ||
                        ""
                    ).toLowerCase();


                const description =
                    (
                        product.description ||
                        ""
                    ).toLowerCase();


                const searchOK =
                    name.includes(search) ||
                    description.includes(search);


                const categoryOK =
                    !category ||
                    product.category === category;


                return searchOK &&
                       categoryOK;

            }
        );


    if (!filtered.length) {

        container.innerHTML = `
            <div class="empty">
                Aucun produit trouvé.
            </div>
        `;

        return;
    }


    container.innerHTML =
        filtered.map(
            product => {

                const image =
                    product.images &&
                    product.images.length
                        ? product.images[0]
                        : "https://via.placeholder.com/600x400?text=Nexora";


                return `

                <article class="card">

                    <img
                        class="card-image"
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(product.name)}"
                    >

                    <div class="card-content">

                        <h3>
                            ${escapeHTML(
                                product.name
                            )}
                        </h3>

                        <p class="card-description">
                            ${escapeHTML(
                                product.description || ""
                            ).substring(0, 110)}
                        </p>

                        <div class="price">
                            ${Number(
                                product.price
                            ).toFixed(2)} €
                        </div>

                        <div class="actions">

                            <button
                                class="primary"
                                onclick="showProduct('${product.id}')"
                            >
                                Voir
                            </button>

                            <button
                                class="secondary"
                                onclick="addToCart('${product.id}')"
                            >
                                🛒
                            </button>

                        </div>

                        ${
                            currentUser
                            ? `

                            <br>

                            <div class="actions">

                                <button
                                    class="secondary"
                                    onclick="editProduct('${product.id}')"
                                >
                                    ✏️
                                </button>

                                <button
                                    class="danger"
                                    onclick="deleteProduct('${product.id}')"
                                >
                                    🗑️
                                </button>

                            </div>

                            `
                            : ""
                        }

                    </div>

                </article>

                `;

            }
        ).join("");

}


/* =====================================================
   8. UPLOAD STORAGE
===================================================== */

async function uploadFile(
    bucket,
    file,
    folder
) {

    const extension =
        file.name.includes(".")
            ? "." +
              file.name
                  .split(".")
                  .pop()
            : "";


    const fileName =
        crypto.randomUUID() +
        extension;


    const path =
        folder +
        "/" +
        fileName;


    const {
        error
    } =
        await supabaseClient
            .storage
            .from(bucket)
            .upload(
                path,
                file,
                {
                    cacheControl: "3600",
                    upsert: false,
                    contentType:
                        file.type ||
                        "application/octet-stream"
                }
            );


    if (error) {

        throw error;

    }


    const {
        data
    } =
        supabaseClient
            .storage
            .from(bucket)
            .getPublicUrl(path);


    return data.publicUrl;

}


/* =====================================================
   9. FORMULAIRE PRODUIT
===================================================== */

function openProductForm() {

    if (!currentUser) {

        alert(
            "Connecte-toi en administrateur."
        );

        return;
    }


    document.getElementById(
        "productTitle"
    ).textContent =
        "Ajouter un produit";


    document.getElementById(
        "productId"
    ).value = "";


    document.getElementById(
        "productName"
    ).value = "";


    document.getElementById(
        "productDescription"
    ).value = "";


    document.getElementById(
        "productPrice"
    ).value = "";


    document.getElementById(
        "productCategory"
    ).value = "";


    document.getElementById(
        "productImages"
    ).value = "";


    document.getElementById(
        "productFiles"
    ).value = "";


    openModal(
        "productModal"
    );

}


/* =====================================================
   10. MODIFIER PRODUIT
===================================================== */

function editProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );


    if (!product) return;


    document.getElementById(
        "productTitle"
    ).textContent =
        "Modifier le produit";


    document.getElementById(
        "productId"
    ).value =
        product.id;


    document.getElementById(
        "productName"
    ).value =
        product.name;


    document.getElementById(
        "productDescription"
    ).value =
        product.description || "";


    document.getElementById(
        "productPrice"
    ).value =
        product.price;


    document.getElementById(
        "productCategory"
    ).value =
        product.category;


    document.getElementById(
        "productImages"
    ).value = "";


    document.getElementById(
        "productFiles"
    ).value = "";


    openModal(
        "productModal"
    );

}


/* =====================================================
   11. ENREGISTRER PRODUIT
===================================================== */

async function saveProduct() {

    if (!currentUser) {

        alert(
            "Connexion administrateur obligatoire."
        );

        return;
    }


    const id =
        document.getElementById(
            "productId"
        ).value;


    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const description =
        document.getElementById(
            "productDescription"
        ).value.trim();


    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );


    const category =
        document.getElementById(
            "productCategory"
        ).value.trim();


    if (
        !name ||
        !category ||
        isNaN(price)
    ) {

        alert(
            "Remplis le nom, le prix et la catégorie."
        );

        return;
    }


    const imageFiles =
        document.getElementById(
            "productImages"
        ).files;


    const digitalFiles =
        document.getElementById(
            "productFiles"
        ).files;


    try {

        let images = [];

        let files = [];


        if (id) {

            const oldProduct =
                products.find(
                    p => p.id === id
                );


            images =
                oldProduct?.images || [];


            files =
                oldProduct?.files || [];

        }


        /* Images */

        for (
            const file
            of imageFiles
        ) {

            const url =
                await uploadFile(
                    "product-images",
                    file,
                    id || crypto.randomUUID()
                );


            images.push(url);

        }


        /* Fichiers */

        for (
            const file
            of digitalFiles
        ) {

            const url =
                await uploadFile(
                    "product-files",
                    file,
                    id || crypto.randomUUID()
                );


            files.push({

                name: file.name,

                url: url,

                size: file.size,

                type: file.type

            });

        }


        const productData = {

            name: name,

            description: description,

            price: price,

            category: category,

            images: images,

            files: files,

            updated_at:
                new Date().toISOString()

        };


        if (id) {

            const {
                error
            } =
                await supabaseClient
                    .from("products")
                    .update(productData)
                    .eq("id", id);


            if (error) throw error;


            alert(
                "✅ Produit modifié !"
            );

        } else {

            const {
                error
            } =
                await supabaseClient
                    .from("products")
                    .insert(productData);


            if (error) throw error;


            alert(
                "✅ Produit ajouté !"
            );

        }


        closeModal(
            "productModal"
        );


        await loadProducts();

    }
    catch (error) {

        console.error(error);

        alert(
            "Erreur : " +
            error.message
        );

    }

}


/* =====================================================
   12. SUPPRIMER
===================================================== */

async function deleteProduct(id) {

    if (!currentUser) return;


    const product =
        products.find(
            p => p.id === id
        );


    if (!product) return;


    const confirmation =
        confirm(
            "Supprimer \"" +
            product.name +
            "\" ?"
        );


    if (!confirmation) return;


    const {
        error
    } =
        await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);


    if (error) {

        alert(
            "Erreur : " +
            error.message
        );

        return;
    }


    products =
        products.filter(
            p => p.id !== id
        );


    updateCategories();

    renderProducts();


    alert(
        "Produit supprimé."
    );

}


/* =====================================================
   13. DETAIL
===================================================== */

function showProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );


    if (!product) return;


    const images =
        product.images || [];


    const mainImage =
        images.length
            ? images[0]
            : "https://via.placeholder.com/600x400?text=Nexora";


    document.getElementById(
        "detailContent"
    ).innerHTML = `

        <h2>
            ${escapeHTML(product.name)}
        </h2>

        <br>

        <img
            id="detailMainImage"
            class="detail-image"
            src="${escapeHTML(mainImage)}"
        >

        ${
            images.length
            ? `

                <div class="gallery">

                    ${
                        images.map(
                            image => `

                            <img
                                src="${escapeHTML(image)}"
                                onclick="
                                    document.getElementById(
                                        'detailMainImage'
                                    ).src =
                                    '${escapeHTML(image)}'
                                "
                            >

                            `
                        ).join("")
                    }

                </div>

            `
            : ""
        }

        <p>
            ${escapeHTML(
                product.description || ""
            )}
        </p>

        <br>

        <div class="price">
            ${Number(
                product.price
            ).toFixed(2)} €
        </div>

        <button
            class="primary"
            onclick="addToCart('${product.id}')"
        >
            🛒 Ajouter au panier
        </button>

    `;


    openModal(
        "detailModal"
    );

}


/* =====================================================
   14. PANIER
===================================================== */

function addToCart(id) {

    const product =
        products.find(
            p => p.id === id
        );


    if (!product) return;


    const existing =
        cart.find(
            item => item.id === id
        );


    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            id: product.id,

            name: product.name,

            price:
                Number(product.price),

            quantity: 1

        });

    }


    updateCart();

    alert(
        product.name +
        " ajouté au panier."
    );

}


function updateCart() {

    const count =
        cart.reduce(
            (total, item) =>
                total +
                item.quantity,
            0
        );


    const total =
        cart.reduce(
            (total, item) =>
                total +
                item.price *
                item.quantity,
            0
        );


    document.getElementById(
        "cartCount"
    ).textContent =
        count;


    document.getElementById(
        "cartTotal"
    ).textContent =
        total.toFixed(2) +
        " €";

}


function openCart() {

    const container =
        document.getElementById(
            "cartContent"
        );


    if (!cart.length) {

        container.innerHTML = `
            <p>
                Ton panier est vide.
            </p>
        `;

        openModal(
            "cartModal"
        );

        return;
    }


    container.innerHTML =

        cart.map(
            item => `

            <div class="cart-item">

                <strong>
                    ${escapeHTML(
                        item.name
                    )}
                </strong>

                <br><br>

                ${item.quantity}
                ×
                ${item.price.toFixed(2)}
                €

                <br><br>

                <button
                    class="danger"
                    onclick="
                        removeFromCart(
                            '${item.id}'
                        )
                    "
                >
                    Supprimer
                </button>

            </div>

            `
        ).join("");


    const total =
        cart.reduce(
            (sum, item) =>
                sum +
                item.price *
                item.quantity,
            0
        );


    container.innerHTML += `

        <br>

        <h3>
            Total :
            ${total.toFixed(2)} €
        </h3>

    `;


    openModal(
        "cartModal"
    );

}


function removeFromCart(id) {

    cart =
        cart.filter(
            item => item.id !== id
        );


    updateCart();

    openCart();

}


/* =====================================================
   15. PAIEMENT
===================================================== */

function checkout() {

    if (!cart.length) {

        alert(
            "Ton panier est vide."
        );

        return;
    }


    alert(
        "💳 Le système de paiement sera connecté à Stripe dans la prochaine étape."
    );

}


/* =====================================================
   16. MODALS
===================================================== */

function openModal(id) {

    document
        .getElementById(id)
        .classList
        .add("active");

}


function closeModal(id) {

    document
        .getElementById(id)
        .classList
        .remove("active");

}


function openLogin() {

    if (currentUser) {

        document
            .getElementById(
                "adminPanel"
            )
            .scrollIntoView({
                behavior: "smooth"
            });

        return;
    }


    openModal(
        "loginModal"
    );

}


/* =====================================================
   17. PROTECTION HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
